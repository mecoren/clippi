#
# CI that, on push of a `v*` tag:
#
# * validates the tag against Cargo.toml and RELEASES.md (cheap `audit` gate)
# * builds artifacts with dist (archives, NSIS installer, DMG, hashes)
# * uploads those artifacts to the temporary workflow zip
# * on success publishes a stable GitHub Release for that tag
#
# Pushing to `wait` no longer releases: the tag is the release, so bot commits
# and ordinary merges cannot rebuild or overwrite a published version.
#
# `workflow_dispatch` is a rehearsal — `dry_run` defaults to true and only
# builds + uploads workflow artifacts. Turning it off publishes from the
# current ref, which is the manual backfill path (it creates the tag too).
#
# The release is created directly as a stable (non-prerelease) release because
# the in-app updater reads `/releases/latest`, which ignores prereleases.

name: Release
permissions:
  "contents": "write"

# A release must never be cancelled halfway: a half-uploaded Release is worse
# than a queued one, so `cancel-in-progress` stays false.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Locally customized from the dist-generated template: `dist init` regenerates
# this file with its own `on:` block, so keep the trigger and the `plan` job's
# tag resolution when that happens (dist-workspace.toml already lists "ci" in
# `allow-dirty`).
#
# Publishing is idempotent per tag — the "Create GitHub Release" step deletes
# the existing release first and never moves the tag — so re-running a failed
# release rebuilds the same assets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布（默认开启；确认流水线无问题后手动关闭才真正发版）"
        required: false
        default: true
        type: boolean

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.tag.outputs.tag }}
      tag-flag: ${{ steps.tag.outputs.tag-flag }}
      # Builds always run; `host` is what decides whether a Release is created.
      publishing: 'true'
      # A tag push publishes. A dispatch only publishes when dry_run is
      # explicitly turned off (the manual backfill path).
      publish_release: ${{ github.event_name == 'push' || inputs.dry_run == false || inputs.dry_run == 'false' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # A tag push carries the version in the tag itself, so nothing is
      # inferred. A manual dispatch has no tag, so it falls back to the crate
      # version to keep `--tag` a valid semver for dist. `audit` rejects a tag
      # that disagrees with the crate version before anything is built.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
            if [ -z "$VERSION" ]; then
              echo "Cannot read the package version from Cargo.toml" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag-flag=--tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # `host --steps=create` is what creates the Release object for a real
      # publication; a rehearsal must stay side-effect free and use `plan`.
      - id: plan
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.dry_run == false || inputs.dry_run == 'false' }}
        run: |
          if [ "${PUBLISH_RELEASE}" = "true" ]; then
            dist host --steps=create ${{ steps.tag.outputs.tag-flag }} --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Cheap gate before the build matrix: a wrong tag or a missing changelog
  # section would otherwise only surface after the Windows + macOS builds.
  audit:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check tag, crate version and release notes agree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot read the package version from Cargo.toml"
            exit 1
          fi

          # `[package.metadata.bundle] version` is a second copy that must move
          # with the crate version; drift ships a wrong app bundle version.
          BUNDLE_VERSION="$(awk '/^\[package\.metadata\.bundle\]/{f=1; next} /^\[/{f=0} f && /^version = /{gsub(/[",]/, ""); print $3; exit}' Cargo.toml)"
          if [ -n "$BUNDLE_VERSION" ] && [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml [package] version ${VERSION} != [package.metadata.bundle] version ${BUNDLE_VERSION}"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${VERSION} — bump the version, commit, then tag that commit"
            exit 1
          fi

          if ! bash scripts/extract_release_notes.sh "$VERSION" RELEASES.md > /dev/null; then
            echo "::error::RELEASES.md has no '# Version ${VERSION}' section"
            exit 1
          fi

          echo "audit ok: v${VERSION}"

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - audit
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Setup macOS environment
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
      - name: Configure NSIS
        if: runner.os == 'Windows'
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.plan.outputs.tag }}"
          VERSION="${VERSION#v}"
          BIN="target/x86_64-pc-windows-msvc/dist/clippi.exe"
          STAGING="target/nsis-staging"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/"
          cp "assets/LOGO_notext.ico" "$STAGING/app.ico"
          cp "LICENSE" "$STAGING/LICENSE.txt"
          # Convert to Windows-style path for makensis
          STAGING_WIN="$(cygpath -w "$PWD/$STAGING")"
          # //D prevents Git Bash from mangling /D into a drive-relative path
          "C:/Program Files (x86)/NSIS/makensis.exe" //INPUTCHARSET UTF8 //DVERSION="$VERSION" "//DSTAGING=$STAGING_WIN" installer.nsi
          # Copy output to distrib for upload
          mkdir -p target/distrib
          cp "$STAGING"/Clippi_*_x64-setup.exe target/distrib/
          sha256sum target/distrib/Clippi_*_x64-setup.exe > target/distrib/Clippi_"${VERSION}"_x64-setup.exe.sha256
          echo "Built NSIS installer: target/distrib/Clippi_${VERSION}_x64-setup.exe"
      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        run: |
          # Extract architecture label from target triple (e.g. aarch64-apple-darwin → aarch64)
          TARGET="${{ matrix.targets[0] }}"
          ARCH="${TARGET%%-*}"
          VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "clippi") | .version')"
          BIN_PATH="target/${TARGET}/dist/clippi"
          APP_DIR="target/Clippi.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/clippi"
          cp "assets/LOGO_notext.icns" "$APP_DIR/Contents/Resources/clippi.icns"
          cat > "$APP_DIR/Contents/Info.plist" << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>English</string>
              <key>CFBundleDisplayName</key>
              <string>Clippi</string>
              <key>CFBundleExecutable</key>
              <string>clippi</string>
              <key>CFBundleIconFile</key>
              <string>clippi</string>
              <key>CFBundleIdentifier</key>
              <string>com.clippi.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Clippi</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSDesktopFolderUsageDescription</key>
              <string>Clippi reads and writes only the desktop folder you choose for database storage or local-folder sync.</string>
              <key>NSDocumentsFolderUsageDescription</key>
              <string>Clippi reads and writes only the documents folder you choose for database storage or local-folder sync.</string>
              <key>NSDownloadsFolderUsageDescription</key>
              <string>Clippi reads and writes only the downloads folder you choose for database storage or local-folder sync.</string>
              <key>NSNetworkVolumesUsageDescription</key>
              <string>Clippi reads and writes only the network folder you choose for local-folder sync.</string>
              <key>NSRemovableVolumesUsageDescription</key>
              <string>Clippi reads and writes only the removable drive folder you choose for database storage or local-folder sync.</string>
          </dict>
          </plist>
          PLISTEOF
          # Ad-hoc sign the .app bundle so Gatekeeper can validate it
          # Without this, the linker's ad-hoc signature expects sealed resources
          # but the manual assembly leaves them unsealed, causing "damaged" error
          # that even right-click → Open cannot bypass
          # Keep a stable designated requirement across ad-hoc builds so macOS
          # can associate Accessibility approval with the Clippi bundle identity
          # instead of a per-build cdhash.
          codesign --deep --force --sign - \
            --requirements '=designated => identifier "com.clippi.app"' \
            "$APP_DIR"
          plutil -lint "$APP_DIR/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP_DIR/Contents/Info.plist")" = "com.clippi.app"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_DIR/Contents/Info.plist")" = "$VERSION"
          plutil -extract NSDocumentsFolderUsageDescription raw "$APP_DIR/Contents/Info.plist" >/dev/null
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_DIR" 2>/dev/null || true)"
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Unexpected App Sandbox entitlement; selected paths would need security-scoped bookmarks." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -v -R='identifier "com.clippi.app"' "$APP_DIR"
          # Create staging directory with .app + Applications symlink
          STAGING="target/dmg-staging"
          DMG_PATH="target/distrib/Clippi_${ARCH}.dmg"
          mkdir -p target/distrib
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_DIR" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Clippi" -srcfolder "$STAGING" -ov -format UDZO -fs HFS+ "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"
          echo "Built macOS .dmg: $DMG_PATH"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          # Include NSIS installer and DMG in upload paths
          if [ -f target/distrib/Clippi_*_x64-setup.exe ]; then
            ls target/distrib/Clippi_*_x64-setup.exe target/distrib/Clippi_*_x64-setup.exe.sha256 >> "$GITHUB_OUTPUT" 2>/dev/null || true
          fi
          # Include macOS DMGs in upload paths
          ls target/distrib/Clippi_*.dmg target/distrib/Clippi_*.dmg.sha256 >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.dmg
            target/distrib/*.dmg.sha256
            target/distrib/*_x64-setup.exe
            target/distrib/*_x64-setup.exe.sha256

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - audit
      - build-local-artifacts
      - build-global-artifacts
    # Only a real publication runs this job (tag push, or a dispatch with
    # dry_run off), and only when audit, plan, local and global didn't fail
    # (skipped is fine).
    if: ${{ always() && needs.audit.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.publish_release == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        shell: bash
        env:
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          VERSION="${TAG#v}"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"

          bash scripts/extract_release_notes.sh "$VERSION" RELEASES.md > "$RELEASE_NOTES"

          if [ ! -s "$RELEASE_NOTES" ]; then
            echo "No release notes found for Version $VERSION in RELEASES.md" >&2
            exit 1
          fi

          # Write and read notes from a file to avoid quoting breaking things.
          # The notes section always comes from RELEASES.md above. cargo-dist
          # auto-detects RELEASES.md as a changelog when it has no BOM and then
          # embeds the same notes ahead of its download table in
          # ANNOUNCEMENT_BODY; append only the "## Download" table so the notes
          # are never duplicated regardless of that detection.
          {
            printf '## Release Notes\n\n'
            cat "$RELEASE_NOTES"
            printf '\n'
            printf '%s\n' "$ANNOUNCEMENT_BODY" | sed -n '/^## Download/,$p'
          } > "$RUNNER_TEMP/notes.txt"

          # Never delete the tag: on a tag push it is the input of this run and
          # must keep pointing at the same commit, so a re-run only rebuilds
          # the release assets.
          gh release delete "$TAG" -y || true

          # Title follows the repo convention of the tag name (v0.4.4, v0.4.5)
          # instead of cargo-dist's changelog-derived "Version 0.4.5".
          # Published as a stable release: the updater queries
          # `/releases/latest`, which skips prereleases, so nothing would ever
          # see a prerelease here.
          #
          # `--target` is only for the manual backfill (no tag yet); attaching
          # to an existing tag must not try to move it.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          else
            gh release create "$TAG" --target "$RELEASE_COMMIT" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          fi
      - name: Add DMG and NSIS to release notes
        env:
          TAG: "${{ needs.plan.outputs.tag }}"
          # Built from the running repository, so the notes never link another
          # project's installers.
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/download"
        run: |
          VERSION="${TAG#v}"
          # Generate DMG rows for any macOS architectures found in artifacts
          DMG_ROWS=""
          for dmg in artifacts/Clippi_*.dmg; do
            [ -f "$dmg" ] || continue
            DMG_FILE="$(basename "$dmg")"
            DMG_URL="${RELEASE_URL}/${TAG}/${DMG_FILE}"
            DMG_CHECK_URL="${RELEASE_URL}/${TAG}/${DMG_FILE}.sha256"
            # Derive human-readable arch label from filename
            case "$DMG_FILE" in
              Clippi_aarch64.dmg)
                LABEL="Apple Silicon macOS (DMG)" ;;
              Clippi_x86_64.dmg)
                LABEL="Intel macOS (DMG)" ;;
              *)
                LABEL="macOS (DMG)" ;;
            esac
            DMG_ROWS="${DMG_ROWS}| [${DMG_FILE}](${DMG_URL}) | ${LABEL} | [checksum](${DMG_CHECK_URL}) |"$'\n'
          done

          NSIS_FILE="Clippi_${VERSION}_x64-setup.exe"
          NSIS_URL="${RELEASE_URL}/${TAG}/${NSIS_FILE}"
          NSIS_CHECK_URL="${RELEASE_URL}/${TAG}/${NSIS_FILE}.sha256"
          NSIS_ROW="| [${NSIS_FILE}](${NSIS_URL}) | x64 Windows (NSIS) | [checksum](${NSIS_CHECK_URL}) |"

          BODY=$(gh release view "$TAG" --json body -q '.body')
          printf '%s\n%s%s\n' "$BODY" "$DMG_ROWS" "$NSIS_ROW" > "$RUNNER_TEMP/notes.txt"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.txt"

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
